<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Krypto-Signale</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Cpath d=%22M1 12l4-5 3 3 6-8%22 stroke=%22%2326a69a%22 stroke-width=%222%22 fill=%22none%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="topbar">
  <div class="brand">Krypto-Signale</div>
  <div id="status" class="status">…</div>
  <div id="sessions" class="sessions" aria-label="Börsenzeiten"></div>
  <div class="group" id="tf-buttons" aria-label="Zeitebene"></div>
  <div class="group" id="hm-buttons" aria-label="Liquidations-Heatmap"></div>
  <div class="group toggles">
    <label><input type="checkbox" data-layer="light"> Trendampel</label>
    <label><input type="checkbox" data-layer="sessions"> Börsenzeiten</label>
    <label><input type="checkbox" data-layer="signals"> Signale</label>
    <label title="Für jedes Signal ein Long/Short-Fenster mit Stop und Ziel, bis eins davon erreicht ist"><input type="checkbox" data-layer="boxes"> Long/Short-Fenster</label>
    <label><input type="checkbox" data-layer="ema"> EMA 20/50/200</label>
    <label><input type="checkbox" data-layer="zones"> Liquiditätszonen</label>
    <label><input type="checkbox" data-layer="fib"> Fibonacci</label>
    <label><input type="checkbox" data-layer="bb"> Bollinger</label>
    <label><input type="checkbox" data-layer="st"> Supertrend</label>
  </div>
  <div class="group strat-wrap">
    <button id="strat-btn" class="btn">Strategien ▾</button>
    <div id="strat-panel" class="strat-panel hidden"></div>
    <button id="bt-open" class="btn">📊 Backtest</button>
    <button id="paper-open" class="btn">📝 Papier-Test</button>
    <button id="news-open" class="btn">📰 News &amp; On-Chain</button>
    <button id="sound-btn" class="btn" title="Ton bei neuen Signalen">🔔 Ton an</button>
  </div>
</header>

<main class="layout">
  <section id="grid" class="grid"></section>
  <aside class="sidebar">
    <h2>Letzte Signale</h2>
    <ul id="signal-list" class="signal-list"><li class="muted">Noch keine Signale</li></ul>
    <p class="disclaimer">Signale und Trefferquoten sind keine Gewinngarantie. Immer mit Stop handeln, max. 1–2 % Risiko pro Trade.</p>
  </aside>
</main>

<div id="focus" class="focus hidden" role="dialog" aria-modal="true">
  <div class="focus-head">
    <div id="focus-title" class="focus-title"></div>
    <div class="group focus-strats" id="focus-strats" aria-label="Strategien ein/aus"></div>
    <div class="group" id="focus-tf"></div>
    <button id="focus-close" class="btn">✕ Schließen (Esc)</button>
  </div>
  <div class="focus-body">
    <div id="focus-chart" class="focus-chart"></div>
    <div id="focus-info" class="focus-info"></div>
  </div>
</div>

<div id="backtest" class="focus hidden" role="dialog" aria-modal="true">
  <div class="focus-head">
    <div class="focus-title">Backtest: Wie oft lagen die Strategien richtig?</div>
    <button id="bt-run" class="btn">Mit eigenen Daten neu berechnen</button>
    <button id="bt-close" class="btn">✕ Schließen (Esc)</button>
  </div>
  <div id="backtest-body" class="bt-body"></div>
</div>

<div id="paper" class="focus hidden" role="dialog" aria-modal="true">
  <div class="focus-head">
    <div class="focus-title">Papier-Test: Wie laufen die Signale wirklich?</div>
    <button id="paper-close" class="btn">✕ Schließen (Esc)</button>
  </div>
  <div id="paper-body" class="bt-body"></div>
</div>

<div id="news" class="focus hidden" role="dialog" aria-modal="true">
  <div class="focus-head">
    <div class="focus-title">News &amp; On-Chain</div>
    <div class="group" id="news-coins" aria-label="Coin wählen"></div>
    <button id="news-close" class="btn">✕ Schließen (Esc)</button>
  </div>
  <div id="news-body" class="bt-body"></div>
</div>

<script src="vendor/lightweight-charts.standalone.production.js"></script>
<script src="app.js"></script>
</body>
</html>
