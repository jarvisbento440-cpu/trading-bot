name: Coin-Scanner-Test

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/scanner_test.py"
      - "signalbot/scanner.py"
      - ".github/workflows/scanner.yml"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # GitHub-Server stehen in den USA, dort ist Binance gesperrt -> Coinbase/Kraken (USD-Paare)
      - name: Live-Scan (Kraken)
        run: |
          mkdir -p results/scanner
          python -m signalbot scanner --exchange kraken --quote USD | tee results/scanner/live-scan-kraken.txt
      - name: Historischer Test (Coinbase)
        run: python scripts/scanner_test.py --out results/scanner
      - name: Ergebnis speichern
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add results/scanner
          git commit -m "Coin-Scanner: Testergebnis" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
