name: Lernmodell

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 1 * *"  # jeden Monatsersten mit den neuesten Kursen nachtrainieren

permissions:
  contents: write

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # GitHub-Server stehen in den USA, dort ist Binance gesperrt -> Coinbase (USD-Paare)
      - run: python scripts/fetch_history.py --since 2021-01-01 --out /tmp/history
      - run: python scripts/learn_research.py /tmp/history /tmp/lernen
      - name: Modell speichern
        run: |
          cp /tmp/lernen/lernmodell.json /tmp/lernen/lern-ergebnis.json results/lernen/
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add results/lernen
          git commit -m "Lernmodell nachtrainiert" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
