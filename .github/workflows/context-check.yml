name: News/On-Chain-Test

on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-1iwdna]
    paths: [scripts/check_context.py, scripts/check_news_live.py, .github/workflows/context-check.yml]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/check_context.py /tmp/ctx
      - run: python scripts/check_news_live.py /tmp/ctx
      - name: In Branch "context-check" speichern
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan context-check
          git rm -rq --cached .
          rm -rf ./* .github .gitignore .gitattributes .env.example 2>/dev/null || true
          mkdir -p ctx && cp /tmp/ctx/* ctx/
          git add ctx
          git commit -qm "News/On-Chain-Test"
          git push -f origin context-check
